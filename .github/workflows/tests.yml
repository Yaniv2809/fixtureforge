name: Tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "pydantic>=2.5.0" "faker>=22.0.0" pyyaml "click>=8.1.0" "rich>=13.7.0" requests
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        env:
          FORGE_SEED: 42
          PYTHONPATH: src
        run: |
          pytest tests/ -v --tb=short --ignore=tests/test_enterprise.py
